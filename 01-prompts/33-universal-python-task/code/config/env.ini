# --- Universal Environment Variables Configuration (env.ini) ---
# Note: Paths are dynamic and resolved at runtime (from $WORK, $GITMAP_WORK_DIR, or user prompt).
# NEVER hardcode static paths. Supports cd $WORK in PowerShell, cd "$WORK" in POSIX shell.
workdir=${WORK}
work=${WORK}
root=${ROOT}
logs=${WORK}/logs
