name: validate-json-configs

on:
  push:
    paths:
      - "**/*.json"
      - "tools/validate-json-configs.mjs"
      - ".github/workflows/validate-json-configs.yml"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate every source JSON config
        run: node tools/validate-json-configs.mjs
