name: test-pester
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0.0
      - name: Run Pester
        shell: pwsh
        run: |
          $r = Invoke-Pester -Path tests/pester -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }
